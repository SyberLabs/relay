name: GrokCell templates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: grokcell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate bundled templates and examples
        run: |
          python scripts/validate_templates.py
          python bots/garbage-collector/eval/verify.py
          python bots/garbage-collector/eval/check_structure.py
