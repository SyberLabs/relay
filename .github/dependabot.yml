version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      development-tools:
        dependency-type: development
        update-types: [minor, patch]
      react-runtime:
        patterns: [react, react-dom, react-server-dom-webpack]
    commit-message:
      prefix: 'deps'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'
